spring:
  application:
    name: geospatials-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/remosens}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # "update" is fine for a launch page. Move to Flyway/Liquibase for the full platform.
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  cors:
    # Comma-separated list of frontend origins allowed to call the API.
    # Override with the CORS_ALLOWED_ORIGINS env var on Render if needed;
    # keep the Vercel production origin first so preflight from the
    # deployed frontend always succeeds.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://geo-spatials-frontend.vercel.app,http://localhost:5173,http://localhost:5174}
